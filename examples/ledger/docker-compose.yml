# docker compose up --build runs the whole example: PostgreSQL, then migrations,
# then a demo tenant, then the API on http://localhost:8082, with two outbox workers
# sharing the queue.
#
# ant is unpublished for now, so the build context is the folder holding both the
# ant and ant-examples checkouts. Once ant is tagged, it can be this folder.
x-app: &app
  build:
    context: ../../..
    dockerfile: ant-examples/examples/ledger/Dockerfile
  environment: &env
    DATABASE_URL: postgres://ledger:ledger@db:5432/ledger?sslmode=disable
    API_TOKEN: dev-token
    # 32 bytes in base64. A real one comes from a secret store.
    ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports: ["127.0.0.1:55442:5432"]
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      # Over TCP, because the image's first-run server answers on the socket and then
      # restarts, which would catch the migrate service mid-connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ledger -d ledger"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app
    command: ["/app/migrate", "up"]
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *app
    command: ["/app/migrate", "seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  server:
    <<: *app
    command: ["/app/server"]
    ports: ["127.0.0.1:8082:8080"]
    depends_on:
      seed:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["/app/worker"]
    deploy:
      replicas: 2
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  db:
